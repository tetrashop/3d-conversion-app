name: Test Build and Deploy
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        cd apps/web
        npm ci --legacy-peer-deps
    
    - name: Build Next.js
      run: |
        cd apps/web
        npm run build
    
    - name: Show success
      run: echo "✅ Build completed successfully!"
